<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>new Student Registration </title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#74b9ff,#a29bfe);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

form{
    width:420px;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#2c3e50;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
    color:#444;
}

input,
select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#007BFF;
}

.password-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.password-box input{
    flex:1;
}

.password-box button{
    padding:10px;
    border:none;
    background:#007BFF;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.password-box button:hover{
    background:#0056b3;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.buttons input{
    width:50%;
    border:none;
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

input[type="submit"]{
    background:#007BFF;
}

input[type="submit"]:hover{
    background:#0056b3;
}

input[type="reset"]{
    background:#dc3545;
}

input[type="reset"]:hover{
    background:#b02a37;
}

</style>

<script>

function togglePassword(){

    var pass=document.getElementById("password");

    if(pass.type==="password")
        pass.type="text";
    else
        pass.type="password";

}

function validate(){

    var firstname=document.getElementById("firstname").value.trim();
    var lastname=document.getElementById("lastname").value.trim();
    var rollno=document.getElementById("rollno").value.trim();
    var dob=document.getElementById("dob").value;
    var gender=document.getElementById("gender").value;
    var email=document.getElementById("email").value.trim();
    var password=document.getElementById("password").value;
    var confirm=document.getElementById("confirm_password").value;
    var phone=document.getElementById("number").value.trim();

    var emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    var namePattern=/^[A-Za-z]+$/;
    var phonePattern=/^[0-9]{10}$/;
    var passPattern=/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{6,}$/;

    if(firstname==""||lastname==""||rollno==""||dob==""||email==""||password==""||confirm==""||phone==""){
        alert("Please fill all fields.");
        return false;
    }

    if(!namePattern.test(firstname)){
        alert("First Name should contain only alphabets.");
        return false;
    }

    if(!namePattern.test(lastname)){
        alert("Last Name should contain only alphabets.");
        return false;
    }

    if(gender=="Select Gender"){
        alert("Please select Gender.");
        return false;
    }

    if(!emailPattern.test(email)){
        alert("Invalid Email.");
        return false;
    }

    if(!passPattern.test(password)){
        alert("Password must contain at least 6 characters including one uppercase, one lowercase and one number.");
        return false;
    }

    if(password!=confirm){
        alert("Passwords do not match.");
        return false;
    }

    if(!phonePattern.test(phone)){
        alert("Phone Number should contain exactly 10 digits.");
        return false;
    }

    alert("Registration Successful!");

    return true;

}

</script>

</head>

<body>

<form onsubmit="return validate()">

<h1>Student Registration</h1>

<label>First Name</label>
<input type="text" id="firstname" placeholder="Enter First Name" required>

<label>Last Name</label>
<input type="text" id="lastname" placeholder="Enter Last Name" required>

<label>Roll Number</label>
<input type="text" id="rollno" placeholder="Enter Roll Number" required>

<label>Date of Birth</label>
<input type="date" id="dob" required>

<label>Gender</label>

<select id="gender" required>
<option>Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Email</label>
<input type="email" id="email" placeholder="Enter Email" required>

<label>Password</label>

<div class="password-box">
<input type="password" id="password" placeholder="Enter Password" required>
<button type="button" onclick="togglePassword()">Show</button>
</div>

<label>Confirm Password</label>
<input type="password" id="confirm_password" placeholder="Confirm Password" required>

<label>Phone Number</label>
<input type="text" id="number" placeholder="Enter Phone Number" maxlength="10" required>

<div class="buttons">
<input type="submit" value="Register">
<input type="reset" value="Reset">
</div>

</form>

</body>
</html>
